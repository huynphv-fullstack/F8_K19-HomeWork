<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Toast thông báo</title>
    <style>
        /* == COLOR VARIABLES == */
        :root {
            --body-bg: #ffffff;
            --open-btn-bg: #3b82f6;
            --open-btn-cl: #ffffff;
            --overlay-bg: rgba(0, 0, 0, 0.5);
            --modal-bg: #ffffff;
            --modal-shadow: rgba(0, 0, 0, 0.1);
            --modal-content: #333333;
            --close-btn-bg: #ef4444;
            --close-btn-cl: #ffffff;
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== BODY ===== */
        body {
            padding: 40px;
            height: 200vh;
            background-color: var(--body-bg);
        }

        /* ===== ẨN CHECKBOX ===== */
        #modal-toggle {
          display: none;
        }

        /* ===== NÚT MỞ ===== */
        .open-btn {
          display: inline-block;
          padding: 12px 24px;
          background-color: var(--open-btn-bg);
          color: var(--open-btn-cl);
          cursor: pointer;
          border-radius: 6px;
          font-weight: bold;
        }

        /* ===== ẨN NÚT MỞ KHI MODAL HIỆN ===== */
        #modal-toggle:checked ~ .open-btn {
          display: none;
        }

        /* ===== CONTAINER CHỨA MODAL & OVERLAY ===== */
        .modal-container {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          display: none;
          align-items: center;
          justify-content: center;
        }

        /* ===== HIỆN CONTAINER KHI CHECKBOX CHECKED ===== */
        #modal-toggle:checked ~ .modal-container {
          display: flex;
        }

        /* ===== OVERLAY (LỚP NỀN) ===== */
        .overlay-bg {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: var(--overlay-bg);
          cursor: pointer;
        }

        /* ===== HỘP NỘI DUNG (MODAL BOX) ===== */
        .modal-content {
          position: relative;
          background: var(--modal-bg);
          padding: 30px;
          width: 90%;
          max-width: 450px;
          border-radius: 12px;
          box-shadow: 0 20px 25px -5px var(--modal-shadow);
          text-align: center;
        }
        .modal-content p {
          color: var(--modal-content);
          margin-bottom: 25px;
          line-height: 1.6;
        }

        /* ===== NÚT ĐÓNG ===== */
        .close-btn {
          display: inline-block;
          padding: 10px 20px;
          background: var(--close-btn-bg);
          color: var(--close-btn-cl);
          cursor: pointer;
          border-radius: 6px;
          font-weight: 500;
        }
    </style>
</head>
<body>
    <input type="checkbox" id="modal-toggle">
    <label for="modal-toggle" class="open-btn">Mở modal</label>
    <div class="modal-container">
        <label for="modal-toggle" class="overlay-bg"></label>
        <div class="modal-content">
            <p>Đây là nội dung thông báo!</p>
            <label for="modal-toggle" class="close-btn">Đóng</label>
        </div>
    </div>
</body>
</html>
